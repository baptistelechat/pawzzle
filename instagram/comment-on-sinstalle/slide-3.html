<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .canvas {
    width: 1080px;
    height: 1350px;
    background: #fff8f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 220px;
    position: relative;
    font-family: "IBM Plex Sans", sans-serif;
  }
  .grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    width: 900px;
    height: 900px;
    gap: 10px;
  }
  .cell {
    position: relative;
    z-index: 1;
    border-radius: 28%;
    corner-shape: squircle;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cell.glow {
    box-shadow: 0 0 0 8px rgba(255, 138, 101, 0.35), 0 0 32px 12px rgba(255, 138, 101, 0.55);
  }
  .cell.region-ring {
    outline: 6px solid rgba(74, 55, 40, 0.55);
    outline-offset: -6px;
  }
  .band {
    position: relative;
    z-index: 0;
    background: rgba(127, 184, 148, 0.28);
    border-radius: 32px;
  }
  .paw { width: 56%; height: 56%; fill: #4a3728; }
  .caption {
    margin-top: 56px;
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: 58px;
    color: #4a3728;
    text-align: center;
    max-width: 900px;
    line-height: 1.3;
  }
  .logo {
    margin-top: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .logo .mark {
    width: 100px;
    height: 100px;
    border-radius: 22%;
    background: linear-gradient(180deg, #ff9c7c, #ff8a65);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo .mark svg { width: 56px; height: 56px; stroke: #fff; }
  .logo .brand { font-family: "Fredoka", sans-serif; font-weight: 700; font-size: 60px; color: #4a3728; }
  .logo .cta { font-family: "IBM Plex Sans", sans-serif; font-size: 32px; color: #7a6553; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="grid"><div class="band" style="grid-column:4;grid-row:1/-1;"></div><div class="cell" style="background-color:oklch(0.85 0.1 30);grid-row:1;grid-column:1;"></div><div class="cell" style="background-color:oklch(0.85 0.1 30);grid-row:1;grid-column:2;"></div><div class="cell" style="background-color:oklch(0.85 0.1 30);grid-row:1;grid-column:3;"></div><div class="cell" style="background-color:oklch(0.85 0.1 90);grid-row:1;grid-column:4;"></div><div class="cell" style="background-color:oklch(0.85 0.1 90);grid-row:1;grid-column:5;"><svg class="paw" viewBox="0 0 100 100">
    <ellipse cx="50" cy="62" rx="26" ry="20"/>
    <ellipse cx="20" cy="32" rx="12" ry="15" transform="rotate(-18 20 32)"/>
    <ellipse cx="44" cy="16" rx="12" ry="15"/>
    <ellipse cx="68" cy="16" rx="12" ry="15"/>
    <ellipse cx="88" cy="34" rx="12" ry="15" transform="rotate(18 88 34)"/>
  </svg></div><div class="cell" style="background-color:oklch(0.85 0.1 90);grid-row:1;grid-column:6;"></div><div class="cell" style="background-color:oklch(0.85 0.1 30);grid-row:2;grid-column:1;"></div><div class="cell" style="background-color:oklch(0.85 0.1 30);grid-row:2;grid-column:2;"><svg class="paw" viewBox="0 0 100 100">
    <ellipse cx="50" cy="62" rx="26" ry="20"/>
    <ellipse cx="20" cy="32" rx="12" ry="15" transform="rotate(-18 20 32)"/>
    <ellipse cx="44" cy="16" rx="12" ry="15"/>
    <ellipse cx="68" cy="16" rx="12" ry="15"/>
    <ellipse cx="88" cy="34" rx="12" ry="15" transform="rotate(18 88 34)"/>
  </svg></div><div class="cell" style="background-color:oklch(0.85 0.1 150);grid-row:2;grid-column:3;"></div><div class="cell" style="background-color:oklch(0.85 0.1 150);grid-row:2;grid-column:4;"></div><div class="cell" style="background-color:oklch(0.85 0.1 90);grid-row:2;grid-column:5;"></div><div class="cell" style="background-color:oklch(0.85 0.1 90);grid-row:2;grid-column:6;"></div><div class="cell" style="background-color:oklch(0.85 0.1 210);grid-row:3;grid-column:1;"></div><div class="cell" style="background-color:oklch(0.85 0.1 30);grid-row:3;grid-column:2;"></div><div class="cell" style="background-color:oklch(0.85 0.1 150);grid-row:3;grid-column:3;"></div><div class="cell" style="background-color:oklch(0.85 0.1 150);grid-row:3;grid-column:4;"><svg class="paw" viewBox="0 0 100 100">
    <ellipse cx="50" cy="62" rx="26" ry="20"/>
    <ellipse cx="20" cy="32" rx="12" ry="15" transform="rotate(-18 20 32)"/>
    <ellipse cx="44" cy="16" rx="12" ry="15"/>
    <ellipse cx="68" cy="16" rx="12" ry="15"/>
    <ellipse cx="88" cy="34" rx="12" ry="15" transform="rotate(18 88 34)"/>
  </svg></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:3;grid-column:5;"></div><div class="cell" style="background-color:oklch(0.85 0.1 90);grid-row:3;grid-column:6;"></div><div class="cell" style="background-color:oklch(0.85 0.1 210);grid-row:4;grid-column:1;"><svg class="paw" viewBox="0 0 100 100">
    <ellipse cx="50" cy="62" rx="26" ry="20"/>
    <ellipse cx="20" cy="32" rx="12" ry="15" transform="rotate(-18 20 32)"/>
    <ellipse cx="44" cy="16" rx="12" ry="15"/>
    <ellipse cx="68" cy="16" rx="12" ry="15"/>
    <ellipse cx="88" cy="34" rx="12" ry="15" transform="rotate(18 88 34)"/>
  </svg></div><div class="cell" style="background-color:oklch(0.85 0.1 210);grid-row:4;grid-column:2;"></div><div class="cell" style="background-color:oklch(0.85 0.1 150);grid-row:4;grid-column:3;"></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:4;grid-column:4;"></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:4;grid-column:5;"></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:4;grid-column:6;"></div><div class="cell" style="background-color:oklch(0.85 0.1 210);grid-row:5;grid-column:1;"></div><div class="cell" style="background-color:oklch(0.85 0.1 210);grid-row:5;grid-column:2;"></div><div class="cell" style="background-color:oklch(0.85 0.1 330);grid-row:5;grid-column:3;"></div><div class="cell" style="background-color:oklch(0.85 0.1 330);grid-row:5;grid-column:4;"></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:5;grid-column:5;"></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:5;grid-column:6;"></div><div class="cell" style="background-color:oklch(0.85 0.1 210);grid-row:6;grid-column:1;"></div><div class="cell" style="background-color:oklch(0.85 0.1 330);grid-row:6;grid-column:2;"></div><div class="cell" style="background-color:oklch(0.85 0.1 330);grid-row:6;grid-column:3;"></div><div class="cell" style="background-color:oklch(0.85 0.1 330);grid-row:6;grid-column:4;"></div><div class="cell" style="background-color:oklch(0.85 0.1 330);grid-row:6;grid-column:5;"></div><div class="cell" style="background-color:oklch(0.85 0.1 270);grid-row:6;grid-column:6;"></div></div>
    <div class="caption">Un chat par colonne.</div>
    
  </div>
</body>
</html>
