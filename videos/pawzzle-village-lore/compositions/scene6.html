<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        @font-face {
          font-family: "Fredoka";
          src: url("assets/fonts/Fredoka-SemiBold.woff2") format("woff2");
          font-weight: 600;
          font-style: normal;
          font-display: block;
        }

        #root {
          position: absolute;
          inset: 0;
          width: 1080px;
          height: 1920px;
          overflow: hidden;
          background: #fff8f0;
        }
        .s6-grid {
          position: absolute;
          left: 130px;
          top: 460px;
          width: 820px;
          height: 820px;
          display: grid;
          grid-template-columns: repeat(6, 130px);
          grid-template-rows: repeat(6, 130px);
          gap: 8px;
        }
        .s6-cell {
          border-radius: 28%;
          border: 2px solid rgba(74, 55, 40, 0.1);
          box-shadow: 0 10px 22px rgba(74, 55, 40, 0.16);
          position: relative;
        }
        @supports (corner-shape: squircle) {
          .s6-cell {
            corner-shape: squircle;
            border-radius: 30%;
          }
        }
        .s6-paw {
          position: absolute;
          inset: 0;
          display: grid;
          place-items: center;
        }
        .s6-paw svg {
          width: 76px;
          height: 76px;
        }
        .s6-dim {
          position: absolute;
          inset: 0;
          background: rgba(255, 248, 240, 0.55);
          opacity: 0;
        }
        .s6-lockup {
          /* top: 960px = true vertical center of the full 1080x1920 canvas. */
          position: absolute;
          left: 50%;
          top: 960px;
          width: 720px;
          transform: translate(-50%, -50%) scale(0.92);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 28px;
          padding: 72px 60px;
          background: #fff8f0;
          border: 3px solid #ffe8d6;
          border-radius: 40px;
          box-shadow: 0 24px 60px rgba(74, 55, 40, 0.16);
          opacity: 0;
        }
        .s6-logo {
          width: 200px;
          height: 200px;
        }
        .s6-wordmark {
          font-family: "Fredoka", sans-serif;
          font-weight: 600;
          font-size: 96px;
          color: #4a3728;
          letter-spacing: -0.01em;
        }
      </style>

      <div
        data-hf-id="hf-b52i"
        id="root"
        data-composition-id="scene6"
        data-width="1080"
        data-height="1920"
        data-duration="4.5"
      >
        <div data-hf-id="hf-ntaa" class="s6-grid" id="s6-grid"></div>
        <div data-hf-id="hf-ib4a" class="s6-dim" id="s6-dim"></div>
        <div data-hf-id="hf-gzcy" class="s6-lockup" id="s6-lockup">
          <img
            data-hf-id="hf-sqjk"
            class="s6-logo"
            src="assets/images/icon.svg"
            alt=""
          />
          <div data-hf-id="hf-elne" class="s6-wordmark">Pawzzle</div>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};

        // Real board from the game engine (generateLevel(6,"square")), frozen.
        const REGIONS = [
          [2, 4, 1, 4, 4, 0],
          [2, 4, 4, 4, 4, 0],
          [2, 2, 4, 4, 0, 0],
          [2, 5, 5, 0, 0, 0],
          [2, 5, 5, 5, 3, 0],
          [2, 2, 5, 5, 0, 0],
        ];
        const REGION_COLORS = [
          "#ffb5a7",
          "#e7cb80",
          "#9ee1ab",
          "#77e0f2",
          "#b4cbff",
          "#f4b6ed",
        ];

        // lucide-react PawPrint (v1.25.0), exact icon node — reused as-is.
        const PAW_SVG =
          '<svg viewBox="0 0 24 24" fill="none" stroke="#4a3728" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
          '<circle cx="11" cy="4" r="2"/>' +
          '<circle cx="18" cy="8" r="2"/>' +
          '<circle cx="20" cy="16" r="2"/>' +
          '<path d="M9 10a5 5 0 0 1 5 5v3.5a3.5 3.5 0 0 1-6.84 1.045Q6.52 17.48 4.46 16.84A3.5 3.5 0 0 1 5.5 10Z"/>' +
          "</svg>";

        // Full, stable solution — same real board as scene 5's end state.
        const SOLUTION = [
          { row: 0, col: 2 },
          { row: 1, col: 5 },
          { row: 2, col: 3 },
          { row: 3, col: 1 },
          { row: 4, col: 4 },
          { row: 5, col: 0 },
        ];

        const gridEl = document.getElementById("s6-grid");
        const cells = [];
        for (let row = 0; row < 6; row++) {
          cells[row] = [];
          for (let col = 0; col < 6; col++) {
            const cell = document.createElement("div");
            cell.className = "s6-cell";
            cell.style.background = REGION_COLORS[REGIONS[row][col]];
            gridEl.appendChild(cell);
            cells[row][col] = cell;
          }
        }
        SOLUTION.forEach(function (pos) {
          const paw = document.createElement("div");
          paw.className = "s6-paw";
          paw.innerHTML = PAW_SVG;
          cells[pos.row][pos.col].appendChild(paw);
        });

        const tl = gsap.timeline({ paused: true });

        // Scrim settles in first, gently — no hard cut into the darkened
        // grid — then the lockup pops in on top of it (calm, layered reveal,
        // same soft-fade vibe as the rest of the video).
        tl.fromTo(
          "#s6-dim",
          { opacity: 0 },
          { opacity: 1, duration: 0.6, ease: "power2.out" },
          0,
        );

        // titlecard-reveal (blueprints-index.md, Brand_Outro-style Adapt):
        // logo + wordmark spring-settle-and-hold via spring-pop-entrance, calm
        // settle — one restrained move, then a still hold to the final frame
        // (no exit — this is the held end card).
        tl.fromTo(
          "#s6-lockup",
          { opacity: 0, scale: 0.92 },
          { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" },
          0.5,
        );

        // sine-wave-loop (rules-index.md), low-amplitude bounded breathe on
        // the held lockup — the titlecard's one subtle live element.
        const lockup = document.getElementById("s6-lockup");
        const phase = { p: 0 };
        tl.to(
          phase,
          {
            p: Math.PI * 2 * 1.4,
            duration: 3.1,
            ease: "none",
            onUpdate: function () {
              const s = Math.sin(phase.p);
              lockup.style.transform =
                "translate(-50%, -50%) scale(" + (1 + s * 0.01) + ")";
            },
          },
          1.3,
        );

        window.__timelines["scene6"] = tl;
      </script>
    </template>
  </body>
</html>
